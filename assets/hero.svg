<svg xmlns="http://www.w3.org/2000/svg" width="850" height="290" viewBox="0 0 850 290" role="img" aria-labelledby="t">
<title id="t">Nguyen Van Nam, Android Engineer: Kotlin, Jetpack Compose, Rust. Synthwave sunset with a moving neon grid.</title>
<style>
.tw{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.gl{stroke:#f72585;stroke-width:1.3;animation:gl 3.5s cubic-bezier(.55,0,1,.45) infinite}
@keyframes gl{0%{transform:translateY(0);opacity:0}20%{opacity:.95}100%{transform:translateY(90px);opacity:.95}}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.shoot{animation:shoot 9s linear infinite;opacity:0}
@keyframes shoot{0%{transform:translate(110px,22px) rotate(20deg);opacity:0}2%{opacity:1}9%{transform:translate(400px,128px) rotate(20deg);opacity:0}100%{transform:translate(400px,128px) rotate(20deg);opacity:0}}
.droid{animation:peek 7s ease-in-out infinite}
@keyframes peek{0%,30%{transform:translateY(30px)}40%,72%{transform:translateY(0)}82%,100%{transform:translateY(30px)}}
.eye{animation:blink 7s infinite}
@keyframes blink{0%,55%,58%,100%{transform:scaleY(1)}56.5%{transform:scaleY(.1)}}
.eye{transform-box:fill-box;transform-origin:center}
.ant{transform-box:fill-box;transform-origin:50% 100%;animation:wig 1.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}
.chip{fill:rgba(247,37,133,.14);stroke:rgba(247,37,133,.65)}
.chipt{font:600 12px 'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#ffd6ec}
.live{animation:live 1.6s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
.caret{animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="850" height="290" rx="18"/></clipPath>
<clipPath id="sky"><rect width="850" height="200"/></clipPath>
<clipPath id="ground"><rect y="200" width="850" height="90"/></clipPath>
<linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07021a"/><stop offset=".6" stop-color="#1f0638"/><stop offset="1" stop-color="#4a0d5e"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset=".24" stop-color="#ff9a6b"/><stop offset=".5" stop-color="#f72585"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#f72585" stop-opacity=".55"/><stop offset="1" stop-color="#f72585" stop-opacity="0"/></radialGradient>
<linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a0d5e" stop-opacity=".95"/><stop offset="1" stop-color="#4a0d5e" stop-opacity="0"/></linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0">
<stop offset="0" stop-color="#fff"/><stop offset=".42" stop-color="#fff"/><stop offset=".5" stop-color="#ff8fd0"/><stop offset=".58" stop-color="#fff"/><stop offset="1" stop-color="#fff"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-480 0;520 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<filter id="neon" x="-10%" y="-40%" width="120%" height="180%">
<feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
<feFlood flood-color="#f72585" flood-opacity=".85"/><feComposite in2="b" operator="in" result="g"/>
<feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<mask id="stripes"><rect width="850" height="290" fill="#fff"/>
<g fill="#000"><rect x="0" y="150" width="850" height="2.5"/><rect x="0" y="162" width="850" height="3.5"/><rect x="0" y="174" width="850" height="4.5"/><rect x="0" y="186" width="850" height="6"/></g>
</mask>
