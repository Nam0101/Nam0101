ass="tw" style="animation-duration:2.5s;animation-delay:-0.5s"/><circle cx="313.4" cy="16.2" r="0.8" class="tw" style="animation-duration:3.8s;animation-delay:-0.7s"/><circle cx="313.9" cy="32.1" r="1.2" class="tw" style="animation-duration:5.0s;animation-delay:-2.3s"/><circle cx="411.8" cy="26.1" r="0.6" class="tw" style="animation-duration:4.2s;animation-delay:-3.7s"/></g>
